name: Raport miesieczny portfela

on:
  schedule:
    # 1. dzień każdego miesiąca, 06:00 UTC (= 7:00 zimą / 8:00 latem w Polsce)
    - cron: "0 6 1 * *"
  workflow_dispatch:   # ręczne uruchomienie: Actions -> Run workflow

permissions:
  contents: write      # potrzebne do "podtrzymania" harmonogramu (commit .last_run)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Przygotuj i wyślij raport
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py

      - name: Zapisz kopię raportu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport
          path: report.txt
          if-no-files-found: ignore

      # GitHub wyłącza harmonogram po 60 dniach bez aktywności w repo.
      # Przy raporcie raz w miesiącu stałoby się to po 2 miesiącach — ten krok temu zapobiega.
      - name: Podtrzymaj harmonogram
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_run
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .last_run
          git commit -m "Raport $(date -u +%Y-%m)" || true
          git push || true
